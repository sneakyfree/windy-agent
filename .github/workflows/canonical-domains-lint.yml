name: canonical-domains-lint
on:
  push:
    branches: [main, master, windy-main]
  pull_request:
jobs:
  lint:
    # Fork PRs never reach the self-hosted runner (public repo; Boss ruling 10-01).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Run canonical-domains lint
        run: bash .github/lint/lint-canonical-domains.sh --config .github/lint/canonical-domains.json .
