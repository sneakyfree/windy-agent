name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    # Fork PRs never reach the self-hosted runner (public repo; Boss ruling 10-01).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: runner-lint (hosted runners are billing-locked)
        run: bash "$GITHUB_WORKSPACE/.github/lint/lint-runner-labels.sh" "$GITHUB_WORKSPACE/.github/workflows"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        # Pinned: setup-uv v4+ resolves "latest" through the releases API at GITHUB_API_URL,
        # which on our self-hosted forge is the forge itself -- it 404s and the job dies
        # before uv is ever installed. An explicit version skips that lookup entirely.
        with:
          version: "0.12.5"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check src/
      - name: Type check
        run: uv run mypy src/windyfly/ --ignore-missing-imports --no-error-summary
      - name: Test
        run: uv run pytest tests/ -v --tb=short

  build:
    # Fork PRs never reach the self-hosted runner (public repo; Boss ruling 10-01).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        # Pinned: setup-uv v4+ resolves "latest" through the releases API at GITHUB_API_URL,
        # which on our self-hosted forge is the forge itself -- it 404s and the job dies
        # before uv is ever installed. An explicit version skips that lookup entirely.
        with:
          version: "0.12.5"
      - name: Build package
        run: uv build
      - name: Upload dist
        # artifact storage billing-blocked 2026-07; build is the CI
        # signal; resumes when billing settles
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: dist
          path: dist/

  docker-build:
    # Board rule: only runners that can actually build images run this. GitHub
    # sets the repo variable DOCKER_CAPABLE=true (veron1 has docker); the Windy
    # Git act runners don't, so the job is skipped there instead of failing.
    if: (vars.DOCKER_CAPABLE == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64]
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t windy-agent .
      - name: The image imports the agent and its one entry point
        run: docker run --rm windy-agent python -c "import windyfly.main, windyfly.cli"
