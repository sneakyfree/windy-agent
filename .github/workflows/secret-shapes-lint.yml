name: secret-shapes-lint
# This repo is PUBLIC: fail on any Telegram-token / Anthropic-key shaped string that is not a known fake.
on:
  push:
    branches: [main, master, windy-main]
  pull_request:
jobs:
  lint:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Secret-shapes lint
        run: python3 .github/lint/lint-secret-shapes.py .
